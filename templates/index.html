<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARM.AI // MOBILE MATRIX</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0B0F19; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
</head>
<body class="text-gray-100 min-h-screen pb-12">
    <header class="border-b border-gray-800 bg-gray-900/50 p-4 sticky top-0 backdrop-blur-md z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-sm font-bold tracking-wider text-red-500">🦅 HARM.AI LIVE</h1>
            <span class="text-xs bg-green-500/10 text-green-400 border border-green-500/20 px-2 py-0.5 rounded-full animate-pulse">📡 ACTIVE</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4" id="matrix-container" hx-get="/api/v1/matrix" hx-trigger="every 2s" hx-swap="innerHTML">
        {% include "matrix_rows.html" %}
    </main>

            <script>
            setInterval(async () => {
                try {
                    const res = await fetch("/dashboard_data.json");
                    const data = await res.json();
                    if (data && data.summary && data.summary.total_value) {
                        const elem = document.querySelector(".card-value, #total-equity, .starting-cash");
                        if (elem) elem.innerText = "$" + data.summary.total_value.toLocaleString("en-US", {minimumFractionDigits: 2});
                    }
                } catch(e) {}
            }, 2000);
            </script>
            
<!-- STRATEGY CONFIG ADMIN PANEL -->
<div class="card my-4 bg-dark text-light border-secondary" id="config-panel" style="border-radius:8px; background:#0d1117;">
  <div class="card-header d-flex justify-content-between align-items-center" style="background:#161b22; border-bottom:1px solid #30363d;">
    <h5 class="m-0 text-info">⚙️ Strategy Rules & Execution Guards</h5>
    <button class="btn btn-sm btn-success px-3" onclick="saveConfig()">Save Rule Changes</button>
  </div>
  <div class="card-body">
    <p class="text-muted small mb-2">Edit JSON parameters below to dynamically adjust live execution guards (e.g. DTE floors, spread caps, late-day cutoffs):</p>
    <pre id="config-editor" contenteditable="true" style="background:#010409; color:#3fb950; padding:15px; border:1px solid #30363d; border-radius:6px; font-family:monospace; max-height:350px; overflow-y:auto; font-size:13px;"></pre>
  </div>
</div>

<script>
async function loadConfig() {
  try {
    const res = await fetch("/api/v1/config");
    const data = await res.json();
    document.getElementById("config-editor").innerText = JSON.stringify(data, null, 2);
  } catch(e) { console.error("Config fetch failed:", e); }
}

async function saveConfig() {
  try {
    const raw = document.getElementById("config-editor").innerText;
    const json = JSON.parse(raw);
    const res = await fetch("/api/v1/config", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(json)
    });
    const reply = await res.json();
    if(reply.status === "SUCCESS") {
      alert("✓ Strategy Rules updated successfully!");
    } else {
      alert("❌ Update failed: " + reply.message);
    }
  } catch(e) { alert("❌ Invalid JSON format! Check syntax before saving."); }
}

document.addEventListener("DOMContentLoaded", loadConfig);
</script>

</body>
            
<!-- /dashboard_data.json -->
</html>
